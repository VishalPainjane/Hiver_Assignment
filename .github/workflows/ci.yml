name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Verify Code Syntax & Hygiene
        run: |
          python -m compileall src/ scripts/ tests/

      - name: Run Unit Tests & Rule Gate Validations
        run: |
          pytest tests/ -v --tb=short

      - name: Test Service Healthz Endpoint
        run: |
          python -c "from fastapi.testclient import TestClient; from src.service.api import app; client = TestClient(app); response = client.get('/healthz'); assert response.status_code == 200, f'Expected 200, got {response.status_code}'; print('Healthz probe passed: 200 OK')"

